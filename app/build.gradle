plugins {
    id 'com.android.application'
}

android {
    namespace 'com.unicodeclipboard.app'
    compileSdk 33

    defaultConfig {
        applicationId "com.unicodeclipboard.app"
        minSdk 21
        targetSdk 33
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
